<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Link Nigeria Computer Business Center | Enterprise E-Government, Verification & Multi-Vendor Digital Gateway</title>
    <script>
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack || String(reason))) || '';
        var lower = String(msg).toLowerCase();
        if (lower.includes('websocket') || lower.includes('vite') || lower.includes('closed without opened') || lower.includes('ws://') || lower.includes('wss://')) {
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        var lower = String(msg).toLowerCase();
        if (lower.includes('websocket') || lower.includes('vite') || lower.includes('closed without opened') || lower.includes('ws://') || lower.includes('wss://')) {
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body class="bg-[#F5F7FA] text-[#111827] antialiased font-sans selection:bg-[#6B7280] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

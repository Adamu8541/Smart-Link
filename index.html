<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Link Nigeria Computer Business Center | Enterprise E-Government, Verification & Multi-Vendor Digital Gateway</title>
    <script>
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e && e.reason && (e.reason.message || e.reason)) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite'))) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite'))) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

  </body>
</html>

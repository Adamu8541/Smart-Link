<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="625" viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Guilloche Pattern -->
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 0 20 20 T 40 20" fill="none" stroke="#008751" stroke-width="0.8" opacity="0.35" />
      <path d="M 0 10 Q 10 30 20 10 T 40 10" fill="none" stroke="#008751" stroke-width="0.8" opacity="0.35" />
      <path d="M 20 0 Q 0 10 20 20 T 20 40" fill="none" stroke="#008751" stroke-width="0.6" opacity="0.25" />
    </pattern>

    <style>
      .green-title { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 900; font-size: 32px; fill: #008751; letter-spacing: 0px; }
      .black-title { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 900; font-size: 28px; fill: #000000; letter-spacing: 0px; }
      .label-text { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 800; font-size: 18px; fill: #555555; letter-spacing: 0.5px; }
      .value-text { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 900; font-size: 24px; fill: #000000; letter-spacing: 1px; }
      .nga-text { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 900; font-size: 42px; fill: #000000; letter-spacing: 2px; }
      .issue-label { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 800; font-size: 18px; fill: #000000; letter-spacing: 1px; }
      .issue-date { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 900; font-size: 22px; fill: #000000; letter-spacing: 1px; }
      .nin-label { font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif; font-weight: 900; font-size: 24px; fill: #000000; }
      .nin-value { font-family: 'Liberation Mono', 'Courier New', monospace; font-weight: 900; font-size: 52px; fill: #000000; letter-spacing: 8px; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="625" rx="20" fill="#f4faf6" />
  <rect width="1000" height="625" rx="20" fill="url(#guilloche)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="996" height="621" rx="18" fill="none" stroke="#008751" stroke-width="2" opacity="0.4" />

  <!-- Coat of Arms Watermark Center -->
  <g transform="translate(500, 310) scale(1.4)" opacity="0.18">
    <!-- Eagle -->
    <path d="M -10 -80 L 0 -110 L 10 -80 L 30 -60 L 0 -70 L -30 -60 Z" fill="#008751" />
    <!-- Shield Y -->
    <path d="M -40 -50 L 0 -50 L 40 -50 L 40 20 Q 40 60 0 80 Q -40 60 -40 20 Z" fill="none" stroke="#008751" stroke-width="8" />
    <path d="M -30 -40 L 0 0 L 30 -40 M 0 0 L 0 60" fill="none" stroke="#008751" stroke-width="12" stroke-linecap="round" />
    <!-- Horses -->
    <path d="M -70 -30 Q -90 -10 -60 30 Q -40 50 -50 70" fill="none" stroke="#008751" stroke-width="8" />
    <path d="M 70 -30 Q 90 -10 60 30 Q 40 50 50 70" fill="none" stroke="#008751" stroke-width="8" />
  </g>

  <!-- Top Title Block -->
  <text x="45" y="70" class="green-title">FEDERAL REPUBLIC OF NIGERIA</text>
  <text x="45" y="112" class="black-title">DIGITAL NIN SLIP</text>

  <!-- Left Silhouette Photo Placeholder -->
  <g transform="translate(45, 155)">
    <path d="M 0 280 C 0 160 30 140 80 140 C 130 140 160 160 160 280 Z" fill="#9e9e9e" />
    <circle cx="80" cy="90" r="50" fill="#9e9e9e" />
  </g>

  <!-- Center Demographics -->
  <g transform="translate(260, 160)">
    <!-- Surname -->
    <text x="0" y="30" class="label-text">SURNAME/NOM</text>
    <text x="0" y="62" class="value-text">RESIDENT</text>

    <!-- Given Names -->
    <text x="0" y="125" class="label-text">GIVEN NAMES/PRÉNOMS</text>
    <text x="0" y="157" class="value-text">PROUD, NIGERIAN</text>

    <!-- DOB & Sex -->
    <text x="0" y="220" class="label-text">DATE OF BIRTH</text>
    <text x="220" y="220" class="label-text">SEX/SEXE</text>

    <text x="0" y="252" class="value-text">01 OCT 1960</text>
    <text x="220" y="252" class="value-text">F</text>
  </g>

  <!-- Right Side QR & NGA -->
  <g transform="translate(710, 50)">
    <!-- QR Code Outer Box -->
    <rect x="0" y="0" width="220" height="220" fill="#ffffff" stroke="#000000" stroke-width="2" rx="6" />
    
    <!-- QR Pattern Elements -->
    <!-- Top-Left Finder -->
    <rect x="15" y="15" width="55" height="55" fill="#000000" />
    <rect x="25" y="25" width="35" height="35" fill="#ffffff" />
    <rect x="33" y="33" width="19" height="19" fill="#000000" />

    <!-- Top-Right Finder -->
    <rect x="150" y="15" width="55" height="55" fill="#000000" />
    <rect x="160" y="25" width="35" height="35" fill="#ffffff" />
    <rect x="168" y="33" width="19" height="19" fill="#000000" />

    <!-- Bottom-Left Finder -->
    <rect x="15" y="150" width="55" height="55" fill="#000000" />
    <rect x="25" y="160" width="35" height="35" fill="#ffffff" />
    <rect x="33" y="168" width="19" height="19" fill="#000000" />

    <!-- Inner QR Modules Matrix -->
    <rect x="85" y="20" width="12" height="12" fill="#000" />
    <rect x="105" y="20" width="24" height="12" fill="#000" />
    <rect x="85" y="40" width="24" height="24" fill="#000" />
    <rect x="120" y="50" width="12" height="24" fill="#000" />
    <rect x="20" y="85" width="40" height="12" fill="#000" />
    <rect x="80" y="85" width="15" height="15" fill="#000" />
    <rect x="110" y="85" width="35" height="15" fill="#000" />
    <rect x="160" y="85" width="30" height="15" fill="#000" />
    <rect x="20" y="110" width="20" height="20" fill="#000" />
    <rect x="50" y="110" width="30" height="12" fill="#000" />
    <rect x="95" y="110" width="20" height="30" fill="#000" />
    <rect x="130" y="110" width="25" height="20" fill="#000" />
    <rect x="170" y="110" width="25" height="25" fill="#000" />
    <rect x="85" y="150" width="30" height="15" fill="#000" />
    <rect x="125" y="145" width="20" height="30" fill="#000" />
    <rect x="155" y="150" width="40" height="15" fill="#000" />
    <rect x="85" y="180" width="50" height="20" fill="#000" />
    <rect x="145" y="175" width="30" height="25" fill="#000" />

    <!-- NGA Text Below QR -->
    <text x="110" y="280" class="nga-text" text-anchor="middle">NGA</text>

    <!-- ISSUE DATE -->
    <text x="110" y="325" class="issue-label" text-anchor="middle">ISSUE DATE</text>
    <text x="110" y="358" class="issue-date" text-anchor="middle">01 JAN 2021</text>
  </g>

  <!-- Bottom NIN Number Section -->
  <g transform="translate(500, 510)">
    <text x="0" y="0" class="nin-label" text-anchor="middle">National Identification Number (NIN)</text>
    <text x="0" y="65" class="nin-value" text-anchor="middle">0000 000 0000</text>
  </g>
</svg>

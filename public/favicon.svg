<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D5C"/>
      <stop offset="50%" stop-color="#12386E"/>
      <stop offset="100%" stop-color="#0A1E3F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Outer security shield / link emblem -->
  <g transform="translate(256, 240)">
    <!-- Central Shield Glow -->
    <path d="M 0 -130 L 110 -80 C 110 50, 60 130, 0 160 C -60 130, -110 50, -110 -80 Z" 
          fill="#17407E" fill-opacity="0.4" stroke="url(#blueGrad)" stroke-width="6"/>

    <!-- Interlocking SmartLink S & Node symbol -->
    <!-- Top Link Node -->
    <circle cx="0" cy="-55" r="28" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="-55" r="14" fill="#FFFFFF"/>

    <!-- Bottom Link Node -->
    <circle cx="0" cy="75" r="28" fill="url(#blueGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="75" r="14" fill="#FFFFFF"/>

    <!-- Connecting Link Curve / Stylized Lightning Link -->
    <path d="M -15 -35 C -65 -10, -65 30, -15 55 L 15 55 C 65 30, 65 -10, 15 -35 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -25 10 L 25 10" 
          stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    SMARTLINK
  </text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="20" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="6">
    NIGERIA
  </text>
</svg>